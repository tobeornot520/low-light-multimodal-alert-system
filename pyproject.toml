[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lowlight-alert"
version = "0.1.0"
description = "Local low-light face recognition and tiered alert prototype"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0,<2.3",
    "opencv-contrib-python>=4.11,<5",
    "onnxruntime>=1.22,<2",
    "paho-mqtt>=2.1,<3",
    "requests>=2.32,<3",
    "python-dotenv>=1.1,<2",
    "PyYAML>=6,<7",
    "Pillow>=11,<13",
]

[project.scripts]
lowlight-alert = "lowlight_alert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
